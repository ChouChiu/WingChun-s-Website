name: Homework Crawler

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_full_update:
        description: 'Force full update (re-fetch all data)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run homework crawler
        env:
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          FORCE_FULL_UPDATE: ${{ github.event.inputs.force_full_update || 'false' }}
        run: bun run scripts/homework-crawler.ts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/hw-list/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update homework data [skip ci]"
            git push
          fi
