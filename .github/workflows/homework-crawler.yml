name: Homework Crawler

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_full_update:
        description: 'Force full update (re-fetch all data)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r hw-list/requirements.txt

      - name: Run homework crawler
        env:
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          FORCE_FULL_UPDATE: ${{ github.event.inputs.force_full_update || 'false' }}
        run: python hw-list/homework_crawler.py
        working-directory: ${{ github.workspace }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/hw-list/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update homework data [skip ci]"
            git push
          fi
