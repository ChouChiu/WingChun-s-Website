name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v1
        with:
          host: 66.154.101.126
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".next,public,package.json,bun.lock,ecosystem.config.cjs,next.config.ts,src/contents,src/app/globals.css,postcss.config.mjs,mdx-components.tsx"
          target: "/var/www/wwchun.top"

      - name: Install dependencies and restart on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 66.154.101.126
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/wwchun.top
            bun install --production
            pm2 restart wwchun-top || pm2 start ecosystem.config.cjs
            echo "Deployed successfully at $(date)"
